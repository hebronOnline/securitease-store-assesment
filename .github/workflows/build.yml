name: Build

# CI workflow: builds the project and runs the full test suite (including the
# Spotless formatting check that is wired into `gradle build`). Runs on every
# push to a non-master branch and on every pull request targeting master, so
# changes are verified before they can be merged.
on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
            build/reports/jacoco
          if-no-files-found: ignore
          retention-days: 7
