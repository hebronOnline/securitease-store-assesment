name: Release

# Release workflow: triggered when changes land on master (i.e. after a merge).
# It re-runs the build and tests as a gate, then builds a Docker image using the
# Spring Boot buildpacks integration (`bootBuildImage`) and publishes it to the
# GitHub Container Registry (GHCR), delivering the project as a Dockerized image.
on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Lowercase image name is required by GHCR; ${{ github.repository }} is
  # owner/repo, which suits the GHCR naming convention ghcr.io/owner/repo.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Build, Test & Publish Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Compute image tags
        id: meta
        run: |
          IMAGE_NAME_LC=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE_NAME_LC}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE_NAME_LC}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_NAME_LC}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image with Spring Boot buildpacks
        run: |
          ./gradlew bootBuildImage --no-daemon --stacktrace \
            --imageName=${{ steps.meta.outputs.sha_tag }}

      - name: Tag and push image
        run: |
          docker tag ${{ steps.meta.outputs.sha_tag }} ${{ steps.meta.outputs.latest_tag }}
          docker push ${{ steps.meta.outputs.sha_tag }}
          docker push ${{ steps.meta.outputs.latest_tag }}
